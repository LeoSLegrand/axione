# Production-like stack (DEC-012). One stack per environment, isolated by project name:
#   docker compose -p axione-staging --env-file ops/staging.env -f compose.prod.yaml up -d
# Variables (never committed): see ops/env.example.
name: axione

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: axione
      POSTGRES_DB: axione
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axione -d axione"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  migrate:
    image: ${MIGRATE_IMAGE:-axione-migrate:local}
    environment:
      DATABASE_URL: postgresql://axione:${POSTGRES_PASSWORD}@db:5432/axione
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  web:
    image: ${WEB_IMAGE:-axione-web:local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://axione:${POSTGRES_PASSWORD}@db:5432/axione
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [backend, frontend]
    deploy:
      resources:
        limits:
          memory: 768M

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [frontend]

volumes:
  db-data:
  caddy-data:
  caddy-config:

networks:
  backend:
    internal: true
  frontend:
