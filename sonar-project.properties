# SonarQube Cloud (DEC-011). Organization and project key come from repository variables
# SONAR_ORGANIZATION and SONAR_PROJECT_KEY, passed by the CI workflow.
sonar.sources=apps/web/src,packages/core/src,packages/db/src
sonar.tests=apps/web/src,packages/core/src,e2e/tests
sonar.test.inclusions=**/*.test.ts,**/*.int.test.ts,**/*.spec.ts
sonar.exclusions=**/generated/**,**/*.test.ts,**/*.int.test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=apps/web/**,packages/db/**,**/index.ts
sonar.sourceEncoding=UTF-8
