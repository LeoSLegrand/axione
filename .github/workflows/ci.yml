# Quality gate on every pull request and on main (DEC-003, DEC-010, DEC-011). Target: under 8 minutes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: axione
          POSTGRES_PASSWORD: axione
          POSTGRES_DB: axione_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axione -d axione_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://axione:axione@localhost:5432/axione_test
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_SCANNER_VERSION: 8.3.1.16491
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for SonarQube new code detection

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Architecture boundaries
        run: pnpm check:boundaries

      - name: Unit and integration tests with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 30

      # The scan action verifies the scanner signature with a key fetched from a public keyserver,
      # without timeout. Caching the verified scanner avoids that network call on most runs.
      - name: Restore SonarQube scanner
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/sonar-scanner-cli
          key: sonar-scanner-cli-${{ env.SONAR_SCANNER_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: SonarQube Cloud analysis
        if: env.SONAR_TOKEN != ''
        timeout-minutes: 5
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scannerVersion: ${{ env.SONAR_SCANNER_VERSION }}
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
