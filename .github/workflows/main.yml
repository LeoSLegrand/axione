# On main: build the images once, publish them to GHCR, then run the full stack on the runner
# (ephemeral staging, DEC-014) and test it end to end (DEC-012).
name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build and publish images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      web: ${{ steps.names.outputs.web }}
      migrate: ${{ steps.names.outputs.migrate }}
    steps:
      - uses: actions/checkout@v7

      - name: Image names
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "web=ghcr.io/${owner}/axione-web:${GITHUB_SHA}"
            echo "migrate=ghcr.io/${owner}/axione-migrate:${GITHUB_SHA}"
            echo "web_latest=ghcr.io/${owner}/axione-web:main"
            echo "migrate_latest=ghcr.io/${owner}/axione-migrate:main"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          push: true
          tags: ${{ steps.names.outputs.web }},${{ steps.names.outputs.web_latest }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Build and push migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ steps.names.outputs.migrate }},${{ steps.names.outputs.migrate_latest }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max

  staging:
    name: Ephemeral staging (e2e, axe, Lighthouse)
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WEB_IMAGE: ${{ needs.images.outputs.web }}
      MIGRATE_IMAGE: ${{ needs.images.outputs.migrate }}
      POSTGRES_PASSWORD: ci-ephemeral-only
      SITE_ADDRESS: localhost
      HTTP_PORT: "8080"
      HTTPS_PORT: "8443"
      E2E_BASE_URL: https://localhost:8443
      E2E_IGNORE_HTTPS_ERRORS: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the stack with the published images
        run: docker compose -p axione-ci -f compose.prod.yaml up -d --wait --wait-timeout 180

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install test tooling
        run: pnpm install --frozen-lockfile --filter @axione/e2e

      - name: Install Chromium
        run: pnpm --filter @axione/e2e exec playwright install --with-deps chromium

      - name: End-to-end tests and accessibility audit
        run: pnpm test:e2e

      - name: Lighthouse
        run: pnpm dlx @lhci/cli@0.16.0 autorun --config=.lighthouserc.json

      - name: Stack logs
        if: failure()
        run: docker compose -p axione-ci -f compose.prod.yaml logs --no-color

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-reports
          path: |
            e2e/playwright-report/
            e2e/test-results/
            .lighthouseci/
          retention-days: 30

      - name: Stop the stack
        if: always()
        run: docker compose -p axione-ci -f compose.prod.yaml down -v
